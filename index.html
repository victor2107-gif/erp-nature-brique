<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout : rail sombre « four » à gauche, une seule zone de travail qui défile ; les listes s'ouvrent en fiche sur place. */
:root{
  --bg:#eceeeb; --surface:#fcfcfb; --surface-2:#f3f4f1; --ink:#1c1613; --ink-2:#564e49; --muted:#7d756f;
  --line:#dadbd4; --line-2:#c3c2b7; --grid:#e1e0d9;
  --accent:#a8401d; --accent-hover:#8a3214; --accent-ink:#ffffff; --accent-soft:#f3e1d8;
  --rail:#241a16; --rail-ink:#f3ece7; --rail-muted:#b5a79e; --rail-active:#3d2b23;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a;
  --good:#0ca30c; --warn:#fab219; --crit:#d03b3b;
  --good-bg:#e3f3e1; --good-ink:#0b5a0b; --warn-bg:#fbefcf; --warn-ink:#6f4b00; --crit-bg:#f8e0de; --crit-ink:#962020; --neutral-bg:#e8e9e4; --neutral-ink:#4b4541;
  --shadow:0 1px 2px rgba(28,22,19,.05),0 10px 30px rgba(28,22,19,.07);
  --font-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --font-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#100f0e; --surface:#1a1a19; --surface-2:#232221; --ink:#f5f1ee; --ink-2:#cac2bc; --muted:#978e88;
  --line:#2f2d2b; --line-2:#413e3b; --grid:#2c2c2a;
  --accent:#e58257; --accent-hover:#f09b74; --accent-ink:#1d0e07; --accent-soft:#3b2218;
  --rail:#0a0908; --rail-ink:#f3ece7; --rail-muted:#a3968e; --rail-active:#2b1e18;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70;
  --good:#0ca30c; --warn:#fab219; --crit:#d03b3b;
  --good-bg:#16301a; --good-ink:#7fdc7f; --warn-bg:#3a2e0e; --warn-ink:#fbc94f; --crit-bg:#3d1a1a; --crit-ink:#f39a9a; --neutral-bg:#2a2927; --neutral-ink:#cac2bc;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#100f0e; --surface:#1a1a19; --surface-2:#232221; --ink:#f5f1ee; --ink-2:#cac2bc; --muted:#978e88;
  --line:#2f2d2b; --line-2:#413e3b; --grid:#2c2c2a;
  --accent:#e58257; --accent-hover:#f09b74; --accent-ink:#1d0e07; --accent-soft:#3b2218;
  --rail:#0a0908; --rail-ink:#f3ece7; --rail-muted:#a3968e; --rail-active:#2b1e18;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70;
  --good:#0ca30c; --warn:#fab219; --crit:#d03b3b;
  --good-bg:#16301a; --good-ink:#7fdc7f; --warn-bg:#3a2e0e; --warn-ink:#fbc94f; --crit-bg:#3d1a1a; --crit-ink:#f39a9a; --neutral-bg:#2a2927; --neutral-ink:#cac2bc;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:14.5px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:1.75rem;font-weight:700;line-height:1.15}
h2{font-size:1.08rem;font-weight:650}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--font-mono);font-size:.9em}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

.shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100dvh}
.rail{background:var(--rail);color:var(--rail-ink);display:flex;flex-direction:column;gap:22px;padding:20px 14px;position:sticky;top:0;align-self:start;height:100dvh}
.brand{display:flex;gap:11px;align-items:center;padding:2px 6px}
.brand svg{flex:none}
.brand strong{font-family:var(--font-display);font-size:1.12rem;font-weight:700;display:block;line-height:1.1}
.brand span{font-size:.74rem;color:var(--rail-muted);letter-spacing:.04em;text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:3px}
.nav button{all:unset;box-sizing:border-box;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 11px;border-radius:7px;cursor:pointer;color:var(--rail-muted);font-weight:500;white-space:nowrap}
.nav button:hover{color:var(--rail-ink);background:var(--rail-active)}
.nav button[aria-current="page"]{color:var(--rail-ink);background:var(--rail-active);box-shadow:inset 3px 0 0 var(--accent)}
.nav button:focus-visible{outline:2px solid var(--rail-ink);outline-offset:-2px}
.nav .count{font-family:var(--font-mono);font-size:.74rem;color:var(--rail-muted)}
.rail-foot{margin-top:auto;font-size:.76rem;color:var(--rail-muted);padding:0 6px;display:flex;gap:7px;align-items:flex-start;line-height:1.35}
.rail-foot i{flex:none;width:8px;height:8px;border-radius:50%;margin-top:4px;background:var(--rail-muted)}
.rail-foot.on i{background:var(--good)}
.rail-foot.off i{background:var(--warn)}

main{padding-block:26px 60px;padding-inline:clamp(16px,3.4vw,40px);min-width:0;display:flex;flex-direction:column;gap:18px;max-width:1240px;width:100%}
main:focus{outline:none}
.vh{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap}
.vh .sub{color:var(--ink-2);margin-top:3px}
.crumb{all:unset;cursor:pointer;color:var(--ink-2);font-size:.86rem;font-weight:500}
.crumb:hover{color:var(--accent)}
.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.grow{flex:1 1 auto;min-width:0}

.btn{all:unset;box-sizing:border-box;display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:8px 14px;border-radius:7px;border:1px solid var(--line-2);background:var(--surface);cursor:pointer;font-weight:550;font-size:.9rem;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-2);color:var(--ink)}
.btn.danger{color:var(--crit-ink)}
.btn.armed{background:var(--crit);border-color:var(--crit);color:#fff}
.btn.sm{padding:5px 9px;font-size:.82rem}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.hint{color:var(--muted);font-size:.84rem}
.banner{border-radius:9px;padding:11px 14px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:.9rem;background:var(--warn-bg);color:var(--warn-ink)}
.banner.info{background:var(--accent-soft);color:var(--ink)}

.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font-size:.78rem;font-weight:600;white-space:nowrap;background:var(--neutral-bg);color:var(--neutral-ink)}
.pill.good{background:var(--good-bg);color:var(--good-ink)}
.pill.warn{background:var(--warn-bg);color:var(--warn-ink)}
.pill.crit{background:var(--crit-bg);color:var(--crit-ink)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.st{display:inline-block;width:8px;height:8px;border-radius:50%;border:1.5px solid currentColor;flex:none}
.st.h{background:linear-gradient(90deg,currentColor 50%,transparent 50%)}
.st.q{background:conic-gradient(currentColor 75%,transparent 0)}
.st.f{background:currentColor}

.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:8px;overflow:hidden;background:var(--surface);flex-wrap:wrap}
.seg button{all:unset;box-sizing:border-box;padding:6px 12px;font-size:.86rem;font-weight:500;cursor:pointer;color:var(--ink-2);white-space:nowrap}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.seg .c{font-family:var(--font-mono);font-size:.76rem;opacity:.75;margin-left:4px}

label.f{display:flex;flex-direction:column;gap:4px;font-size:.8rem;font-weight:550;color:var(--ink-2);min-width:0}
.in{border:1px solid var(--line-2);background:var(--surface);border-radius:7px;padding:8px 10px;width:100%;min-width:0;color:var(--ink);font-weight:400;font-size:.92rem}
.in:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
.in[disabled]{background:var(--surface-2);color:var(--ink-2)}
textarea.in{resize:vertical;min-height:70px}
.in.r{text-align:right;font-variant-numeric:tabular-nums}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.check{display:flex;gap:8px;align-items:center;font-size:.9rem;color:var(--ink)}
.check input{width:17px;height:17px;accent-color:var(--accent)}

.tw{overflow-x:auto;margin-inline:-4px;padding-inline:4px}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line-2);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child>td{border-bottom:0}
th.r,td.r{text-align:right}
td.r{font-variant-numeric:tabular-nums;white-space:nowrap}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:var(--surface-2)}
.link{all:unset;cursor:pointer;font-family:var(--font-mono);font-size:.86rem;font-weight:500;color:var(--accent)}
.link:hover{text-decoration:underline}
.link:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
.lines td{padding:6px 5px;border-bottom:0;vertical-align:top}
.lines td.r{padding-top:15px}
.lines th{padding-inline:5px}
.tag-ex{font-size:.68rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line-2);border-radius:4px;padding:0 5px;margin-left:6px;vertical-align:middle}

.edit{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}
.totals{position:sticky;top:18px}
.totals dl{margin:0;display:grid;grid-template-columns:1fr auto;gap:7px 12px;font-size:.92rem}
.totals dt{color:var(--ink-2)}
.totals dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.totals .ttc{font-size:1.2rem;font-weight:650;border-top:1px solid var(--line-2);padding-top:10px;color:var(--ink)}
.stack{display:flex;flex-direction:column;gap:8px}
.stack .btn{width:100%}

.empty{border:1px dashed var(--line-2);border-radius:10px;padding:34px 20px;text-align:center;color:var(--ink-2);display:flex;flex-direction:column;gap:12px;align-items:center}
.empty strong{font-family:var(--font-display);font-size:1.1rem;color:var(--ink)}
.empty p{max-width:52ch}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:3px;min-width:0}
.tile .l{font-size:.8rem;color:var(--ink-2);display:flex;align-items:center;gap:7px}
.tile .v{font-size:1.65rem;font-weight:600;line-height:1.15}
.tile .d{font-size:.8rem;color:var(--muted)}
.key{display:inline-block;width:10px;height:10px;border-radius:3px;flex:none}
.legend{display:flex;gap:6px 18px;flex-wrap:wrap;font-size:.86rem;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.plot{position:relative;width:100%;min-height:250px}
.plot svg{display:block;width:100%;height:250px}
.plot text{font-family:var(--font-body);font-size:11px;fill:var(--muted);font-variant-numeric:tabular-nums}
.tt{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--line-2);border-radius:8px;box-shadow:var(--shadow);padding:8px 10px;font-size:.82rem;min-width:150px;z-index:2}
.tt h4{margin:0 0 5px;font-size:.78rem;color:var(--muted);font-weight:600;text-transform:capitalize}
.tt div{display:flex;justify-content:space-between;gap:14px;align-items:center}
.tt div span{display:inline-flex;gap:6px;align-items:center;color:var(--ink-2)}
.tt div b{font-variant-numeric:tabular-nums;font-weight:600}
#tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--surface);border-radius:7px;padding:7px 10px;font-size:.8rem;white-space:pre-line;z-index:50;max-width:260px}
.pbars{display:flex;flex-direction:column;gap:14px}
.prow{display:grid;grid-template-columns:minmax(120px,230px) minmax(0,1fr);gap:4px 14px;align-items:center}
.pname{font-size:.88rem;font-weight:500;overflow-wrap:anywhere}
.ptrack{display:flex;flex-direction:column;gap:2px;min-width:0}
.pb{display:flex;align-items:center;gap:7px;height:11px}
.pb i{display:block;height:10px;border-radius:0 4px 4px 0;min-width:2px;flex:0 0 auto}
.pb span{font-size:.72rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}

.oflist{display:flex;flex-direction:column;gap:10px}
.ofc{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr) auto;gap:8px 18px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:13px 16px}
.ofc:hover{border-color:var(--ink-2)}
.ofc:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ofc .t{font-weight:600}
.ofc .m{font-size:.82rem;color:var(--ink-2)}
.meter{display:flex;flex-direction:column;gap:3px;min-width:0}
.meter .bar{height:7px;border-radius:4px;background:var(--neutral-bg);overflow:hidden}
.meter .bar i{display:block;height:100%;border-radius:4px}
.meter small{font-size:.74rem;color:var(--muted);font-variant-numeric:tabular-nums;display:flex;justify-content:space-between;gap:8px}
.journal{display:flex;flex-direction:column}
.jr{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:.88rem}
.jr:last-child{border-bottom:0}
.jr .note{color:var(--muted);font-size:.8rem}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px 18px}
.kv div{min-width:0}
.kv dt{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.kv dd{margin:2px 0 0;overflow-wrap:anywhere}

.modal{position:fixed;inset:0;z-index:40;background:rgba(16,12,10,.55);display:grid;place-items:center;padding:16px;overflow:auto}
.dlg{background:var(--surface);color:var(--ink);border:1px solid var(--line-2);border-radius:12px;box-shadow:var(--shadow);width:min(600px,100%);padding:20px;display:flex;flex-direction:column;gap:14px}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px 0;font-size:.84rem;font-weight:550;color:var(--muted)}
.steps li{display:flex;align-items:center;gap:7px}
.steps li+li::before{content:"";width:22px;height:1px;background:var(--line-2);margin-inline:8px}
.steps b{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line-2);font-size:.72rem;font-weight:600;font-variant-numeric:tabular-nums}
.steps .done{color:var(--ink-2)}
.steps .done b{background:var(--ink-2);border-color:var(--ink-2);color:var(--surface)}
.steps .cur{color:var(--ink)}
.steps .cur b{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.next{background:var(--accent-soft);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:11px}
.next p{max-width:70ch}
.dlg-f{display:flex;gap:9px;justify-content:flex-end;flex-wrap:wrap}
.err{color:var(--crit-ink);font-size:.86rem;font-weight:500}
#toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:9px;font-size:.9rem;font-weight:500;box-shadow:var(--shadow);z-index:60;max-width:calc(100vw - 32px);opacity:0;pointer-events:none;transition:opacity .18s}
#toast.show{opacity:1}
body.ro [data-w]{display:none!important}
body.noadm [data-adm]{display:none!important}
.cat .in{padding:6px 8px}
.how{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px;max-width:75ch}
.res{display:flex;flex-direction:column;gap:4px}
.res button{all:unset;box-sizing:border-box;cursor:pointer;padding:7px 10px;border:1px solid var(--line);border-radius:7px;display:flex;justify-content:space-between;gap:10px}
.res button:hover{border-color:var(--accent)}
.res button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.res small{color:var(--muted)}
.cat td{padding:6px 5px}
body.nopdf [data-pdf]{display:none!important}
.nav-sec{font-size:.68rem;text-transform:uppercase;letter-spacing:.09em;color:var(--rail-muted);padding:16px 11px 5px;font-weight:600}
.qa{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.qa-b{all:unset;box-sizing:border-box;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.qa-b:hover{border-color:var(--accent)}
.qa-b:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.qa-b b{font-weight:600;color:var(--ink)}
.qa-b span{font-size:.82rem;color:var(--ink-2)}
.qa-b.main{background:var(--accent);border-color:var(--accent)}
.qa-b.main b,.qa-b.main span{color:var(--accent-ink)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:18px}
.calc{background:var(--surface-2);border-radius:8px;padding:9px 12px;font-size:.86rem;color:var(--ink-2)}
.login{position:fixed;inset:0;z-index:70;background:var(--bg);display:grid;place-items:center;padding:16px;overflow:auto}
.lg-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);width:min(400px,100%);padding:26px;display:flex;flex-direction:column;gap:14px}
.lo{all:unset;cursor:pointer;color:var(--rail-ink);text-decoration:underline;font-size:.76rem;display:inline-block;margin-top:4px}
.lo:focus-visible{outline:2px solid var(--rail-ink);outline-offset:2px}

@media (max-width:900px){
  .edit{grid-template-columns:minmax(0,1fr)}
  .totals{position:static}
}
@media (max-width:760px){

const wait = ms => new Promise(r => setTimeout(r, ms));

}

function monthsRange(){

}
function aggregate(){

      const q = +l.qte||0, s = ofLine(o, l.pid); reste += Math.max(0, q-s.fab); resteLiv += Math.max(0, q-s.liv);

}

function refreshTotals(){
  const d = S.draft; if (!d) return; const t = totals(d);
  d.lignes.forEach((l,i) => { const c = $('#lt-'+i); if (c) c.textContent = fNum((+l.qte||0)*(+l.pu||0)); });
  const set = (id, v) => { const n = $('#'+id); if (n) n.textContent = v; };
  set('t-st', fF(t.st)); set('t-rem', '− '+fF(t.rem)); set('t-ht', fF(t.ht)); set('t-tva', fF(t.tva)); set('t-aib', fF(t.aib)); set('t-ttc', fF(t.ttc));
  set('t-aib-l', 'AIB '+(d.aibOn!==false ? t.aibRate+' %' : '')); set('t-tva-l', 'TVA '+(d.tvaOn ? (+d.tva||0)+' %' : ''));
}
function devisError(msg){ const e = $('#d-err'); if (e){ e.textContent = msg; e.hidden = false; e.scrollIntoView({block:'center'}); } toast(msg); }
function devisCheck(strict){
  const d = S.draft;
  if (!String(d.client.nom||'').trim()) return devisError("Choisissez le client du devis."), false;
  if (strict){
    const ok = d.lignes.filter(l => (+l.qte||0) > 0 && String(l.designation||'').trim());
    if (!ok.length) return devisError("Ajoutez au moins un produit avec une quantité."), false;
  }
  return true;
}
async function devisPersist(patch){
  const d = Object.assign(S.draft, patch||{}); const now = new Date().toISOString();
  if (!S.draftId){ S.draftId = uid('d'); d.creeLe = now; d.numero = nextNum('DEV', S.devis); }
  d.majLe = now; delete d.exemple;
  d.lignes = d.lignes.filter(l => String(l.designation||'').trim() || (+l.qte||0) > 0).map(l => ({...l, qte:+l.qte||0, pu:+l.pu||0}));
  if (!d.lignes.length) d.lignes = [blankLine()];
  await setDoc('devis', S.draftId, clone(d));
}

/* ---------- ordres de fabrication ---------- */
function ofCard(o){
  const s = ofStats(o);
  return `<button class="ofc" type="button" data-act="open-of" data-id="${esc(o.id)}">
    <span><span class="t"><span class="mono">${esc(o.numero)}</span> · ${esc(o.client&&o.client.nom||'—')}</span>${o.exemple?'<span class="tag-ex">exemple</span>':''}<br><span class="m">Émis le ${fDate(o.date)} · livraison prévue le ${fDate(o.echeance)}${o.priorite==='urgente'?' · urgent':''}</span></span>
    <span class="meter"><span class="bar"><i style="width:${Math.round(s.pf*100)}%;background:var(--s2)"></i></span><span class="bar"><i style="width:${Math.round(s.pl*100)}%;background:var(--s3)"></i></span><small><span>Fabriqué ${Math.round(s.pf*100)} %</span><span>Livré ${Math.round(s.pl*100)} %</span></small></span>
    <span class="row" style="justify-content:flex-end">${s.retard?'<span class="pill crit"><span aria-hidden="true">▲</span>En retard</span>':''}${pill(OST,s.st)}</span>
  </button>`;
}
V.ordres = () => {
  if (S.ofId){ const o = S.ordres.find(x => x.id===S.ofId); if (o) return ofDetail(o); S.ofId = null; }
  const head = `<header class="vh"><div><h1>Ordres de fabrication</h1><p class="sub">Émis à la confirmation d'un devis, suivis jusqu'à la livraison</p></div></header>`;
  if (!S.ordres.length) return head + `<div class="empty"><strong>Aucun ordre de fabrication</strong><p>Un ordre apparaît ici dès qu'un devis validé est confirmé par le client. Vous pourrez alors l'envoyer à l'usine par e-mail et saisir les quantités fabriquées et livrées.</p><button class="btn" type="button" data-act="nav" data-v="devis">Voir les devis</button></div>`;
  const st = S.ordres.map(o => [o, ofStats(o).st]), cnt = k => st.filter(([,s]) => k==='tous' || s===k).length;
  const chips = [['tous','Tous'],['planifie','À fabriquer'],['encours','En fabrication'],['pret','Fabriqués'],['livre','Livrés']];
  const rows = st.filter(([,s]) => S.fOf==='tous' || s===S.fOf).map(([o]) => o);
  return head + `<div class="row"><div class="seg" role="group" aria-label="Statut">${chips.map(([k,l]) => `<button type="button" data-act="set" data-k="fOf" data-val="${k}" aria-pressed="${S.fOf===k}">${l}<span class="c">${cnt(k)}</span></button>`).join('')}</div></div>
  <div class="oflist">${rows.map(ofCard).join('') || `<p class="hint">Aucun ordre dans cet état.</p>`}</div>`;
};
function ofDetail(o){
  const s = ofStats(o), mv = S.mv || (S.mv = {type:'fab', date:today(), pid:(o.lignes[0]||{}).pid||'', qte:'', note:''});
  const names = new Map(o.lignes.map(l => [l.pid, l.designation]));
  const rows = o.lignes.map(l => { const x = ofLine(o,l.pid), q = +l.qte||0; return `<tr><td>${l.ref?`<span class="mono">${esc(l.ref)}</span><br>`:''}${esc(l.designation)}</td><td class="r">${fNum(q)} <span class="hint">${esc(l.unite||'')}</span></td><td class="r">${fNum(x.fab)}</td><td class="r">${fNum(x.liv)}</td><td class="r">${fNum(Math.max(0,q-x.fab))}</td><td style="min-width:120px"><span class="meter"><span class="bar"><i style="width:${q?Math.min(100,Math.round(100*x.fab/q)):0}%;background:var(--s2)"></i></span><span class="bar"><i style="width:${q?Math.min(100,Math.round(100*x.liv/q)):0}%;background:var(--s3)"></i></span></span></td></tr>`; }).join('');
  const jr = [...(o.mouvements||[])].sort((a,b) => String(b.date).localeCompare(String(a.date))).map(m => `<div class="jr"><span class="pill ${m.type==='liv'?'good':'warn'}">${m.type==='liv'?'Livraison':'Fabrication'}</span><span><span class="num">${fDate(m.date)}</span> · ${esc(names.get(m.pid)||'Produit')}${m.note?`<br><span class="note">${esc(m.note)}</span>`:''}</span><b class="num">${fNum(m.qte)}</b><button class="btn sm ghost danger" type="button" data-w data-act="mv-del" data-id="${esc(m.id)}" data-confirm="Supprimer ?" aria-label="Supprimer ce mouvement">✕</button></div>`).join('');
  return `<header class="vh"><div><button class="crumb" type="button" data-act="nav" data-v="ordres">← Tous les ordres</button><h1>Ordre <span class="mono" style="font-size:.8em">${esc(o.numero)}</span></h1><p class="sub">${pill(OST,s.st)} ${s.retard?'<span class="pill crit"><span aria-hidden="true">▲</span>En retard</span>':''}${o.priorite==='urgente'?' <span class="pill warn">Urgent</span>':''}</p></div>
    <div class="row"><button class="btn primary" type="button" data-act="mail" data-kind="of">Envoyer par e-mail</button><button class="btn" type="button" data-pdf data-act="pdf" data-kind="of">Télécharger le PDF</button><button class="btn" type="button" data-w data-act="of-edit">Modifier</button><button class="btn danger" type="button" data-w data-act="of-del" data-confirm="Confirmer la suppression">Supprimer</button></div></header>
  <section class="card"><dl class="kv" style="margin:0">
    <div><dt>Client</dt><dd>${esc(o.client&&o.client.nom||'—')}${o.client&&o.client.tel?'<br><span class="hint">'+esc(o.client.tel)+'</span>':''}</dd></div>
    <div><dt>Chantier / adresse</dt><dd>${esc(o.client&&o.client.adresse||'—')}</dd></div>
    <div><dt>Devis d'origine</dt><dd>${o.devisId && S.devis.some(d=>d.id===o.devisId) ? `<button class="link" type="button" data-act="open-devis" data-id="${esc(o.devisId)}">${esc(o.devisNumero||'')}</button>` : `<span class="mono">${esc(o.devisNumero||'—')}</span>`}</dd></div>
    <div><dt>Émis le</dt><dd class="num">${fDate(o.date)}</dd></div>
    <div><dt>Livraison prévue</dt><dd class="num">${fDate(o.echeance)}</dd></div>
    <div><dt>Envoi par e-mail</dt><dd>${o.envoi ? 'Envoyé à '+esc(o.envoi.a||'l\'usine')+' le '+fDate(o.envoi.date) : '<span class="hint">Pas encore envoyé</span>'}</dd></div>
  </dl>${o.instructions?`<div><span class="hint">Instructions pour l'usine</span><p style="white-space:pre-line">${esc(o.instructions)}</p></div>`:''}</section>
  <section class="card"><div class="card-h"><h2>Produits à fabriquer</h2><div class="legend"><span><i class="key" style="background:var(--s2)"></i>Fabriqué</span><span><i class="key" style="background:var(--s3)"></i>Livré</span></div></div><div class="tw"><table style="min-width:640px"><thead><tr><th>Produit</th><th class="r">Commandé</th><th class="r">Fabriqué</th><th class="r">Livré</th><th class="r">Reste à fabriquer</th><th>Avancement</th></tr></thead><tbody>${rows}</tbody></table></div></section>
  <section class="card" data-w><h2>Saisir une fabrication ou une livraison</h2>
    <div class="row"><div class="seg" role="group" aria-label="Type de mouvement"><button type="button" data-act="mv-type" data-val="fab" aria-pressed="${mv.type==='fab'}">Fabrication</button><button type="button" data-act="mv-type" data-val="liv" aria-pressed="${mv.type==='liv'}">Livraison</button></div></div>
    <div class="grid2">
      <label class="f">Date<input class="in" id="mv-date" type="date" data-bind="mv:date" value="${esc(mv.date)}"></label>
      <label class="f">Produit<select class="in" id="mv-pid" data-bind="mv:pid">${o.lignes.map(l => `<option value="${esc(l.pid)}" ${mv.pid===l.pid?'selected':''}>${esc(l.designation)}</option>`).join('')}</select></label>
      <label class="f">Quantité<input class="in r" id="mv-qte" type="number" min="1" step="1" inputmode="numeric" data-bind="mv:qte" value="${esc(mv.qte)}"></label>
      <label class="f">${mv.type==='liv'?'N° de bon de livraison, camion…':'Four, équipe, remarque…'}<input class="in" id="mv-note" data-bind="mv:note" value="${esc(mv.note)}"></label>
    </div>
    <p class="err" id="mv-err" hidden></p>

  <section class="card"><h2>Journal des mouvements</h2>${jr ? `<div class="journal">${jr}</div>` : `<p class="hint">Aucune fabrication ni livraison saisie pour cet ordre.</p>`}</section>`;
}

let uq = 0;
async function userSearch(q){
  const res = $('#u-res'); if (!res || !S.usr) return; const my = ++uq; let hits = [];
  try { hits = q.trim().length >= 2 ? await S.usr.search(q.trim()) : []; } catch(e){}
  if (my !== uq || !$('#u-res')) return; res.textContent = '';
  window.__hits = hits;
  if (!hits.length){ if (q.trim().length >= 2){ const p = document.createElement('p'); p.className = 'hint'; p.textContent = "Aucune personne trouvée. Pour une personne extérieure à l'organisation, saisissez directement son nom et son e-mail ci-dessous."; res.appendChild(p); } return; }
  hits.forEach((h, i) => { const b = document.createElement('button'); b.type = 'button'; b.dataset.act = 'user-pick'; b.dataset.i = i; const n = document.createElement('span'); n.textContent = h.name || 'Sans nom'; const m = document.createElement('small'); m.textContent = h.email || ''; b.append(n, m); res.appendChild(b); });
}

function armed(btn){
  if (btn.dataset.armed) return true;
  btn.dataset.armed = '1'; btn.dataset.label = btn.textContent; btn.textContent = btn.dataset.confirm || 'Confirmer ?'; btn.classList.add('armed');
  setTimeout(() => { if (btn.isConnected && btn.dataset.armed){ delete btn.dataset.armed; btn.textContent = btn.dataset.label; btn.classList.remove('armed'); } }, 4500);
  return false;
}

function prodCalc(ht){
  if (ht==='' || ht==null || !(+ht >= 0)) return "Saisissez le prix de la liste : le prix HT est calculé en retirant l'AIB ("+(+cfg().aib||0)+" %). Le devis ajoute ensuite l'AIB et la TVA.";
  const h = +ht, a = r2(h*(+cfg().aib||0)/100), t = r2(h*(+cfg().tva||0)/100);
  return 'Pour une pièce : HT '+fP(h)+' + AIB '+fP(a)+' + TVA '+fP(t)+' = <b>'+fP(r2(h+a+t))+'</b> à payer. Prix TVAC sans AIB : '+fP(r2(h+t))+'.';
}

function mailText(kind){
  const c = cfg(), sign = '\n\nCordialement,\n'+c.societe+(c.tel?'\nTél. : '+c.tel:'')+(c.email?'\n'+c.email:'');
  if (kind==='invit'){
    const u = S.invRec || {};
    return {to: u.email||'', subject: `Accès à la plateforme ERP — ${c.societe}`,
      body: `Bonjour ${u.nom||''},\n\nVotre compte sur la plateforme ERP de ${c.societe} (devis, ordres de fabrication, livraisons) est créé, avec le rôle : ${ROLES[u.role]||''}.\n\nAdresse du site : ${APP_URL}\nIdentifiant : ${u.email||''}\nMot de passe provisoire : communiqué séparément.\n\nÀ la première connexion, changez votre mot de passe : sur l'écran de connexion, saisissez votre e-mail puis cliquez sur « Mot de passe oublié ? ».`+sign};
  }
  if (kind==='devis'){
    const d = S.draft, t = totals(d);
    return {to: d.client.email||'', subject: `Devis ${d.numero} — ${c.societe}`,
      body: `Bonjour,\n\nVeuillez trouver notre devis n° ${d.numero} du ${fDate(d.date)}, valable jusqu'au ${fDate(d.validite)}.\n\n`+
        d.lignes.filter(l => +l.qte>0).map(l => `• ${fNum(l.qte)} ${l.unite||''} — ${l.designation} à ${fF(l.pu)} : ${fF(l.qte*l.pu)}`).join('\n')+
        `\n\nTotal HT : ${fF(t.ht)}`+(t.rem?` (remise de ${+d.remise} % incluse)`:'')+(t.aib?`\nAIB ${t.aibRate} % : ${fF(t.aib)}`:'')+(d.tvaOn?`\nTVA ${+d.tva} % : ${fF(t.tva)}`:'')+`\nTotal TTC : ${fF(t.ttc)}`+
        (d.notes?`\n\n${d.notes}`:'')+`\n\nNous restons à votre disposition pour toute précision.`+sign};
  }
  const o = S.ordres.find(x => x.id===S.ofId);
  return {to: c.emailAtelier||'', subject: `Ordre de fabrication ${o.numero} — ${o.client.nom} — livraison le ${fDate(o.echeance)}`,
    body: `Bonjour,\n\nMerci de lancer la fabrication de l'ordre n° ${o.numero} (devis ${o.devisNumero||'—'}).\n\nClient : ${o.client.nom}`+(o.client.adresse?`\nChantier : ${o.client.adresse}`:'')+
      `\nLivraison prévue le : ${fDate(o.echeance)}`+(o.priorite==='urgente'?'\nPriorité : URGENT':'')+`\n\nÀ fabriquer :\n`+
      o.lignes.map(l => `• ${fNum(l.qte)} ${l.unite||''} — ${l.designation}${l.ref?' ('+l.ref+')':''}`).join('\n')+
      (o.instructions?`\n\nInstructions :\n${o.instructions}`:'')+`\n\nLes quantités fabriquées et livrées sont à saisir dans la plateforme.`+sign};
}

const pdfSafe = s => String(s ?? '').replace(/[   ]/g,' ').replace(/[–—−]/g,'-').replace(/[‘’]/g,"'").replace(/[“”]/g,'"').replace(/•/g,'-').replace(/œ/g,'oe').replace(/Œ/g,'OE').replace(/[^\x00-\xff]/g,'');
function makePdf(kind, d){
  const doc = new window.jspdf.jsPDF({unit:'mm', format:'a4'}), c = cfg(), W = 210, M = 16, R = W-M; let y = 20;
  const T = (s, x, yy, o) => doc.text(pdfSafe(s), x, yy, o||{});
  const font = (st, sz, col) => { doc.setFont('helvetica', st); doc.setFontSize(sz); doc.setTextColor(...(col||[28,22,19])); };
  const wrap = (s, w) => doc.splitTextToSize(pdfSafe(s), w);

  font('bold', kind==='devis'?18:13); T(kind==='devis'?'DEVIS':'ORDRE DE FABRICATION', R, y, {align:'right'});
  font('normal', 8.5, [86,78,73]); let yl = y+5.5;
  for (const line of [c.siege && 'Siège : '+c.siege, c.usine && 'Usine : '+c.usine, [c.tel,c.email].filter(Boolean).join('  |  ')].filter(Boolean)) for (const part of wrap(line, 100)){ doc.text(part, M, yl); yl += 4; }
  font('normal', 10); let yr = y+7; T('N° '+d.numero, R, yr, {align:'right'}); yr += 5;
  font('normal', 9, [86,78,73]); T((kind==='devis'?'Date : ':'Émis le : ')+fDate(d.date), R, yr, {align:'right'}); yr += 4.5;
  T(kind==='devis' ? 'Valable jusqu\'au : '+fDate(d.validite) : 'Livraison prévue : '+fDate(d.echeance), R, yr, {align:'right'}); yr += 4.5;
  if (kind==='of'){ T('Devis : '+(d.devisNumero||'-')+(d.priorite==='urgente'?'   URGENT':''), R, yr, {align:'right'}); yr += 4.5; }
  y = Math.max(yl, yr)+3; doc.setDrawColor(168,64,29); doc.setLineWidth(.6); doc.line(M, y, R, y); y += 8;
  font('bold', 8, [125,117,111]); T('CLIENT', M, y); y += 5; font('bold', 11); T(d.client.nom||'-', M, y); y += 5;
  font('normal', 9.5, [86,78,73]);
  for (const s of [d.client.adresse, [d.client.tel, d.client.email].filter(Boolean).join('  |  '), d.client.ifu && 'IFU : '+d.client.ifu].filter(Boolean)) for (const part of wrap(s, 178)){ doc.text(part, M, y); y += 4.5; }
  y += 5;
  const cols = kind==='devis'
    ? [['Réf.', M, 'l'], ['Désignation', M+24, 'l'], ['Qté', 120, 'r'], ['Unité', 123, 'l'], ['P.U. HT', 164, 'r'], ['Total HT', R, 'r']]
    : [['Réf.', M, 'l'], ['Désignation', M+24, 'l'], ['Unité', 112, 'l'], ['À fabriquer', 150, 'r'], ['Fabriqué', 172, 'r'], ['Livré', R, 'r']];
  const dw = kind==='devis' ? 62 : 66;
  const headRow = () => { doc.setFillColor(243,225,216); doc.rect(M, y-5, R-M, 7.5, 'F'); font('bold', 8.5); cols.forEach(([t,x,al]) => T(t, al==='r'?x:x+1.5, y, {align: al==='r'?'right':'left'})); y += 7; };
  headRow();
  for (const l of d.lignes.filter(l => (+l.qte||0) > 0 || String(l.designation||'').trim())){
    const des = wrap(l.designation, dw), h = Math.max(6.5, des.length*4.2+2.3);
    if (y+h > 272){ doc.addPage(); y = 22; headRow(); }
    font('normal', 9.5); const q = +l.qte||0;
    T(l.ref||'', M+1.5, y); doc.text(des, M+25.5, y);
    if (kind==='devis'){ T(fNum(q), 120, y, {align:'right'}); T(l.unite||'', 124.5, y); T(fNum(l.pu), 164, y, {align:'right'}); T(fNum(q*(+l.pu||0)), R, y, {align:'right'}); }
    else { const s = ofLine(d, l.pid); T(l.unite||'', 113.5, y); T(fNum(q), 150, y, {align:'right'}); T(fNum(s.fab), 172, y, {align:'right'}); T(fNum(s.liv), R, y, {align:'right'}); }

  }
  if (y > 225){ doc.addPage(); y = 22; }
  if (kind==='devis'){
    const t = totals(d); y += 2;
    const rowT = (lab, val, bold) => { font(bold?'bold':'normal', bold?11:9.5); T(lab, 150, y, {align:'right'}); T(val, R, y, {align:'right'}); y += bold?7:5.5; };
    rowT('Sous-total HT', fNum(t.st)+' F CFA'); if (t.rem) rowT('Remise '+(+d.remise)+' %', '- '+fNum(t.rem)+' F CFA');
    rowT('Total HT', fNum(t.ht)+' F CFA'); if (d.aibOn!==false) rowT('AIB '+t.aibRate+' %', fNum(t.aib)+' F CFA'); if (d.tvaOn) rowT('TVA '+(+d.tva)+' %', fNum(t.tva)+' F CFA');
    y += 1; rowT('TOTAL TTC', fNum(t.ttc)+' F CFA', true);
  }
  const block = (title, txt) => { if (!txt) return; if (y > 250){ doc.addPage(); y = 22; } y += 4; font('bold', 8, [125,117,111]); T(title, M, y); y += 5; font('normal', 9.5, [86,78,73]); for (const part of wrap(txt, 178)){ if (y > 280){ doc.addPage(); y = 22; } doc.text(part, M, y); y += 4.5; } };
  if (kind==='devis'){ block('NOTES ET CONDITIONS', d.notes); block('MENTIONS', c.mentions); } else block("INSTRUCTIONS POUR L'USINE", d.instructions);

  return doc.output('arraybuffer');
}
async function savePdf(kind){

      const cols = ['produits','clients','devis','ordres','config'], writes = [];
      for (const c of cols) for (const [id, v] of Object.entries(data[c]||{})) if (v && typeof v==='object') writes.push([c, id, v]);
      if (!writes.length){ msg.textContent = "Aucune donnée reconnue dans ce fichier."; return; }
      msg.textContent = 'Import de '+writes.length+' fiche(s)…';
      try {
        if (db){ for (let i=0;i<writes.length;i+=400){ const b = db.batch(); for (const [c,id,v] of writes.slice(i,i+400)) b.set(db.collection(c).doc(id), v); await b.commit(); } }
        else for (const [c,id,v] of writes) localUpsert(c, id, v, false);
        const n = k => writes.filter(w => w[0]===k).length;
        S.impMsg = msg.textContent = 'Import terminé : '+n('produits')+' produit(s), '+n('clients')+' client(s), '+n('devis')+' devis, '+n('ordres')+' ordre(s), '+n('config')+' paramètre(s).'; toast('Données importées'); scheduleRender();
      } catch(e){ console.error(e); msg.textContent = errMsg(e); }
    };
    rd.readAsText(f);
  },
  mail(el){ mailDlg(el.dataset.kind); },
  'mail-copy'(){ const ta = $('#m-body'), txt = 'Objet : '+$('#m-sub').value+'\n\n'+ta.value; const fb = () => { ta.focus(); ta.select(); toast('Sélectionné : copiez avec Ctrl+C'); }; try { navigator.clipboard.writeText(txt).then(() => toast('Message copié'), fb); } catch(e){ fb(); } },
  'mail-done'(){ const to = $('#m-to').value.trim(); run(async () => { await updDoc('ordres', S.ofId, {envoi: {date: today(), a: to}}); closeDlg(); toast('Ordre marqué comme envoyé'); }); },
  pdf(el){ savePdf(el.dataset.kind); }
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  if (el.tagName==='TR' && e.target.closest('button,a,input,select')) return;
  const f = ACT[el.dataset.act]; if (f){ e.preventDefault(); S.act = el.dataset.act+':'+(el.dataset.id||el.dataset.val||''); f(el, e); }
});
const ROOTS = {draft: () => S.draft, mv: () => S.mv, cfg: () => S.cfgDraft, ui: () => S};
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id==='m-to' || t.id==='m-sub' || t.id==='m-body') return mailLink();
  if (t.id==='u-q') return userSearch(t.value);
  if (t.id==='p-liste' || t.id==='p-prix'){
    const o = $(t.id==='p-liste' ? '#p-prix' : '#p-liste'), v = t.value;
    if (o) o.value = v==='' ? '' : t.id==='p-liste' ? r2(+v/aibK()) : r2(+v*aibK());
    const c = $('#p-calc'); if (c) c.innerHTML = prodCalc($('#p-prix').value);
    return;
  }
  if (t.dataset.on==='rq-field'){ (S.rq[t.dataset.id] = S.rq[t.dataset.id] || {})[t.dataset.f] = t.value; return; }
  if (t.dataset.on==='client-sel'){
    const c = S.clients.find(x => x.id===t.value); if (c) S.draft.client = {id:c.id, nom:c.nom||'', tel:c.tel||'', email:c.email||'', adresse:c.adresse||'', ifu:c.ifu||''};
    return render();
  }
  if (t.dataset.on==='prod-cell'){
    const key = t.dataset.id+':'+t.dataset.f;
    if (t.type==='checkbox'){ S.act = 'prod-cell:'+key; run(async () => { await updDoc('produits', t.dataset.id, {actif: t.checked, majLe: new Date().toISOString()}); toast(t.checked ? 'Produit proposé dans les devis' : 'Produit masqué dans les devis'); }); }
    else S.pedit[key] = t.value;
    return;
  }
  if (t.dataset.on==='line-prod'){
    const l = S.draft.lignes[+t.dataset.i], p = S.produits.find(x => x.id===t.value);
    if (p) Object.assign(l, {pid:p.id, ref:p.ref||'', designation: p.nom+(p.format?' '+p.format:''), unite:p.unite||'pièce', pu:+p.prix||0}); else l.pid = '';
    return render();
  }
  const b = t.dataset.bind; if (!b) return;
  const [root, path] = b.split(':'), o = ROOTS[root](); if (!o) return;
  setPath(o, path, t.type==='checkbox' ? t.checked : t.type==='number' ? (t.value==='' ? '' : +t.value) : t.value);
  if (root==='draft') refreshTotals();
  if (t.dataset.re) scheduleRender();
});
document.addEventListener('change', e => {
  const t = e.target; if (t.dataset.on!=='prod-cell' || t.type==='checkbox') return;
  const id = t.dataset.id, f = t.dataset.f, key = id+':'+f, p = S.produits.find(x => x.id===id); if (!p) return;
  const back = msg => { delete S.pedit[key]; toast(msg); render(); };
  let v = t.value.trim();
  if (f==='prix'){ if (v==='' || !(+v >= 0)) return back('Indiquez un prix valide, en F CFA hors taxes.'); v = r2(v); }
  if (f==='nom' && !v) return back('La désignation ne peut pas être vide.');
  if (String(p[f] ?? '')===String(v)){ delete S.pedit[key]; return; }
  S.act = 'prod-cell:'+key;
  run(async () => { await updDoc('produits', id, {[f]: v, exemple: false, majLe: new Date().toISOString()}); delete S.pedit[key]; toast(f==='prix' ? 'Prix mis à jour : '+fP(v)+' HT' : 'Produit mis à jour'); });
});
dlg.addEventListener('click', e => { if (e.target === dlg) closeDlg(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !dlg.hidden) closeDlg(); });
const tip = $('#tip');
document.addEventListener('pointermove', e => {
  const r = e.target.closest && e.target.closest('[data-tip]');
  if (!r){ if (!tip.hidden) tip.hidden = true; return; }
  tip.textContent = r.dataset.tip; tip.hidden = false;
  const w = tip.offsetWidth, h = tip.offsetHeight; let x = e.clientX+14, y = e.clientY+14;
  if (x+w > innerWidth-8) x = e.clientX-w-14; if (y+h > innerHeight-8) y = e.clientY-h-14;
  tip.style.left = Math.max(8,x)+'px'; tip.style.top = Math.max(8,y)+'px';
});
let rz = 0;
if (window.ResizeObserver) new ResizeObserver(() => { clearTimeout(rz); rz = setTimeout(() => { if (S.view==='tableau' && S.vue==='graph') drawMois(); }, 120); }).observe($('#main'));
const h0 = location.hash.replace('#',''); if (VIEWS.includes(h0)) S.view = h0;
render(); init();
})();
</script>
